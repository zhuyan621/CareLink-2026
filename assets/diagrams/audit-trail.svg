<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">CareLink audit trail</title><desc id="desc">A schematic record joins request identifier, execution status, source status and human review. It is not a real audit export.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#262c28"/><stop offset="1" stop-color="#34302a"/></linearGradient></defs><path fill="url(#bg)" d="M0 0h800v600H0z"/>
<g font-family="Arial,sans-serif"><text x="48" y="60" fill="#dcb398" font-size="13" letter-spacing="3">CARELINK / AUDIT DESIGN</text><text x="48" y="119" fill="#f4ede2" font-size="38">Keep the process visible.</text>
<rect x="72" y="173" width="656" height="320" rx="12" fill="#202922" stroke="#9da88c"/><path d="M72 230h656" stroke="#7b896f"/><g fill="#d0b396" font-size="12" letter-spacing="1"><text x="100" y="207">REQUEST</text><text x="320" y="207">STATE</text><text x="515" y="207">REVIEW</text></g>
<g stroke="#67785e" stroke-opacity=".7"><path d="M96 292h608M96 352h608M96 412h608M294 245v225M489 245v225"/></g><g fill="#c9d1b9" font-size="15"><text x="101" y="270">INPUT ID</text><text x="101" y="330">ENGINE STATUS</text><text x="101" y="390">SOURCE CHECK</text><text x="101" y="450">HUMAN NOTE</text></g>
<g fill="#bcc6a6"><rect x="321" y="259" width="130" height="7" rx="3"/><rect x="321" y="319" width="93" height="7" rx="3"/><rect x="321" y="379" width="119" height="7" rx="3"/><rect x="321" y="439" width="75" height="7" rx="3"/></g><g fill="none" stroke="#d1a880" stroke-width="2"><circle cx="538" cy="263" r="9"/><circle cx="538" cy="323" r="9"/><circle cx="538" cy="383" r="9"/><circle cx="538" cy="443" r="9"/></g><g stroke="#9c9f87" stroke-width="5" stroke-linecap="round"><path d="M567 263h108M567 323h80M567 383h95M567 443h67"/></g>
<text x="48" y="561" fill="#a39f90" font-size="11" letter-spacing="1.5">SCHEMATIC RECORD / NO FABRICATED RECEIPT / NOT A LIVE RESULT</text></g></svg>
