<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">CareLink input workflow</title><desc id="desc">Original diagram of narrative input, observations and actions becoming a structured record. Not patient data.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#161c1b"/><stop offset="1" stop-color="#39312b"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#dfd4bd" stroke-opacity=".06"/></pattern></defs>
<path fill="url(#bg)" d="M0 0h800v600H0z"/><path fill="url(#grid)" d="M0 0h800v600H0z"/>
<g font-family="Arial,sans-serif"><text x="48" y="60" fill="#dcb398" font-size="13" letter-spacing="3">CARELINK / INPUT DESIGN</text><text x="48" y="119" fill="#f4ede2" font-size="38">From narrative to structure.</text>
<g fill="#232b28" stroke="#c4baa0" stroke-opacity=".45"><rect x="49" y="177" width="288" height="98" rx="8"/><rect x="49" y="295" width="288" height="98" rx="8"/><rect x="49" y="413" width="288" height="98" rx="8"/><rect x="463" y="218" width="287" height="255" rx="12"/></g>
<g fill="#d9e1ca" font-size="20"><text x="75" y="216">01 / OBSERVATION</text><text x="75" y="334">02 / VITAL SIGNS</text><text x="75" y="452">03 / ACTION TAKEN</text></g><g fill="#aaa89a" font-size="13"><text x="75" y="248">What changed? When?</text><text x="75" y="366">Value + unit + context</text><text x="75" y="484">What was done? By whom?</text></g>
