<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">Evidence traceability</title><desc id="desc">Candidate documents are checked for identifiers, provenance and retrieval time. Traceability does not establish clinical validity.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#202521"/><stop offset="1" stop-color="#34332b"/></linearGradient></defs><path fill="url(#bg)" d="M0 0h800v600H0z"/>
<g font-family="Arial,sans-serif"><text x="48" y="60" fill="#dcb398" font-size="13" letter-spacing="3">CARELINK / EVIDENCE TRACE</text><text x="48" y="119" fill="#f4ede2" font-size="38">A source, not a certainty.</text>
<g fill="#29322b" stroke="#9ba88c"><rect x="65" y="194" width="235" height="240" rx="12"/><rect x="91" y="218" width="185" height="36" rx="4" fill="#45533c"/></g><g stroke="#a4ad96" stroke-width="5" stroke-linecap="round"><path d="M93 285h160M93 314h143M93 343h164M93 372h100"/></g><text x="112" y="241" fill="#e1e7d3" font-size="12">CANDIDATE DOCUMENT</text>
<path d="M300 316h99" stroke="#cca27e" stroke-width="2"/><path d="m388 308 12 8-12 8" fill="none" stroke="#cca27e" stroke-width="2"/>
<g fill="#242b25" stroke="#697a62"><rect x="421" y="182" width="309" height="70" rx="8"/><rect x="421" y="270" width="309" height="70" rx="8"/><rect x="421" y="358" width="309" height="70" rx="8"/></g>
<g fill="#d4dec3" font-size="18"><text x="446" y="223">DOI / PMID / SOURCE URL</text><text x="446" y="311">RETRIEVAL TIMESTAMP</text><text x="446" y="399">ACCEPT / REJECT / WHY</text></g><path d="M65 482h665" stroke="#686f5b"/><text x="65" y="515" fill="#d4af8e" font-size="15">PROVENANCE CHECK ≠ CLINICAL VALIDATION</text>
<text x="48" y="561" fill="#a39f90" font-size="11" letter-spacing="1.5">SOURCE-BASED SCHEMATIC / NOT AN EXECUTION RECEIPT</text></g></svg>
