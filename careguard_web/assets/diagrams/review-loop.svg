<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">Human review workflow</title><desc id="desc">An automatic result is inspected by a human who records a decision and explanation before export. No real clinical result is depicted.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#29231f"/><stop offset="1" stop-color="#1d2925"/></linearGradient></defs><path fill="url(#bg)" d="M0 0h800v600H0z"/>
<g font-family="Arial,sans-serif"><text x="48" y="60" fill="#dcb398" font-size="13" letter-spacing="3">CARELINK / HUMAN IN THE LOOP</text><text x="48" y="119" fill="#f4ede2" font-size="38">A system with a handover.</text>
<circle cx="400" cy="323" r="140" fill="none" stroke="#8e9b80" stroke-dasharray="4 9"/><circle cx="400" cy="323" r="97" fill="#2d382d" stroke="#bcc7a3"/>
<circle cx="400" cy="291" r="22" fill="none" stroke="#d9c2a5" stroke-width="3"/><path d="M355 345c0-42 90-42 90 0" fill="none" stroke="#d9c2a5" stroke-width="3"/><text x="400" y="384" text-anchor="middle" fill="#e7e7d2" font-size="14">HUMAN REVIEW</text>
<g fill="#2a3028" stroke="#9caa89"><rect x="55" y="198" width="190" height="78" rx="8"/><rect x="555" y="198" width="190" height="78" rx="8"/><rect x="55" y="384" width="190" height="78" rx="8"/><rect x="555" y="384" width="190" height="78" rx="8"/></g>
<g fill="#dbe1cb" font-size="16" text-anchor="middle"><text x="150" y="243">INSPECT OUTPUT</text><text x="650" y="243">CHECK SOURCES</text><text x="150" y="429">RECORD DECISION</text><text x="650" y="429">EXPORT AUDIT</text></g>
<g stroke="#b49b7d" fill="none" stroke-width="2"><path d="M245 239h50M505 239h50M245 423h50M505 423h50"/></g><text x="48" y="561" fill="#a39f90" font-size="11" letter-spacing="1.5">WORKFLOW DESIGN / PROFESSIONALS OWN THE FINAL DECISION</text></g></svg>
